name: Add check-in

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date (YYYY-MM-DD, blank = today Pacific)"
        required: false
      rank:
        description: "Rank (e.g. 1)"
        required: true
      total:
        description: "Total players (optional)"
        required: false
      note:
        description: "Note (optional)"
        required: false

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add or replace check-in entry
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('data/leaderboard.json', 'utf8'));

            const inputDate = '${{ github.event.inputs.date }}'.trim();
            const date = inputDate || new Intl.DateTimeFormat('en-CA', {
              timeZone: 'America/Los_Angeles',
              year: 'numeric', month: '2-digit', day: '2-digit'
            }).format(new Date());

            const rank = Number('${{ github.event.inputs.rank }}');
            const totalStr = '${{ github.event.inputs.total }}'.trim();
            const total = totalStr ? Number(totalStr) : (data.totalPlayers || null);
            const note = '${{ github.event.inputs.note }}'.trim() || undefined;

            const entry = { date, rank, total };
            if (note) entry.note = note;

            const idx = data.checkins.findIndex(c => c.date === date);
            if (idx >= 0) {
              data.checkins[idx] = entry;
              console.log('Replaced existing entry for', date);
            } else {
              data.checkins.push(entry);
              console.log('Added new entry for', date);
            }

            data.checkins.sort((a, b) => a.date < b.date ? -1 : 1);
            fs.writeFileSync('data/leaderboard.json', JSON.stringify(data, null, 2));
          "

      - name: Commit
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/leaderboard.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: add check-in for ${{ github.event.inputs.date || 'today' }} [manual]"
            git push
          fi
