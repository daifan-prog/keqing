name: Update total players

on:
  workflow_dispatch:
    inputs:
      total:
        description: "Total number of players on the leaderboard"
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update total players
        run: |
          TOTAL="${{ github.event.inputs.total }}"
          if ! [[ "$TOTAL" =~ ^[0-9]+$ ]]; then
            echo "Error: '$TOTAL' is not a valid number"
            exit 1
          fi

          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('data/leaderboard.json', 'utf8'));

            data.totalPlayers = Number($TOTAL);

            // Also update today's checkin if one exists
            const today = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'America/Los_Angeles',
              year: 'numeric', month: '2-digit', day: '2-digit'
            }).format(new Date());

            const idx = data.checkins.findIndex(c => c.date === today);
            if (idx >= 0) {
              data.checkins[idx].total = Number($TOTAL);
            }

            fs.writeFileSync('data/leaderboard.json', JSON.stringify(data, null, 2));
            console.log('Updated totalPlayers to', $TOTAL);
          "

      - name: Commit
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/leaderboard.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update total players to ${{ github.event.inputs.total }} [manual]"
            git push
          fi
