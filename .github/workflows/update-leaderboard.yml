name: Update leaderboard data

on:
  schedule:
    - cron: "0 9 * * *"   # 2 AM PT (9 AM UTC)
    - cron: "0 17 * * *"  # 10 AM PT (5 PM UTC) — redundancy trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright's browser
        run: npx playwright install chromium --with-deps

      - name: Fetch latest leaderboard data
        run: node scripts/update-leaderboard.mjs

      - name: Capture fresh build screenshot
        run: node scripts/screenshot-build.mjs

      - name: Commit updated data if changed
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "bot@users.noreply.github.com"

          # Only add files that actually exist
          for f in data/leaderboard.json data/build-screenshot.png; do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "Skipping $f (not found)"
            fi
          done

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update leaderboard data [automated]"
            git push
          fi
